name: Build DarkNote APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'
          cache: true

      # Limpieza segura: Elimina android y pubspec.lock si existen, sin fallar si no existen
      - name: Clean Environment
        run: |
          rm -rf android || true
          rm -f pubspec.lock || true
          flutter clean

      # Regenera solo la parte de Android con el nombre correcto
      - name: Recreate Android Project
        run: flutter create --platforms=android --project-name darknote .

      # Obtiene dependencias forzando la versión correcta de file_picker
      - name: Get Dependencies
        run: flutter pub get

      # Asegura que el Manifiesto tenga el paquete correcto
      - name: Fix Android Manifest
        run: |
          sed -i 's/package="com.example.darknote"/package="com.darknote.app"/g' android/app/src/main/AndroidManifest.xml

      # Compilación Release dividida por arquitectura (más ligero)
      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      # Sube los APKs como artefactos
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darknote-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
