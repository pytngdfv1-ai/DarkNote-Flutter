name: Build DarkNote APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      # Limpieza profunda para evitar conflictos de versiones
      - name: Clean Project
        run: |
          rm -rf android
          rm pubspec.lock
          flutter clean

      - name: Recreate Android Project
        run: flutter create --platforms=android --project-name darknote .

      - name: Get dependencies
        run: flutter pub get

      - name: Fix Android Manifest
        run: |
          sed -i 's/package="com.example.darknote"/package="com.darknote.app"/g' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK (Split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darknote-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
