name: Build DarkNote APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      - name: Backup custom files
        run: |
          mkdir -p /tmp/darknote_backup
          cp pubspec.yaml /tmp/darknote_backup/
          cp -r lib /tmp/darknote_backup/

      - name: Generate Flutter Project Structure with valid name
        run: flutter create --platforms=android darknote_app

      - name: Copy generated android folder to root
        run: |
          mv darknote_app/android ./
          mv darknote_app/pubspec.yaml ./pubspec.yaml.original
          rm -rf darknote_app

      - name: Restore custom pubspec.yaml
        run: cp /tmp/darknote_backup/pubspec.yaml ./pubspec.yaml

      - name: Restore custom lib folder
        run: cp -r /tmp/darknote_backup/lib ./

      - name: Get dependencies
        run: flutter pub get

      - name: Create Android local properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: darknote-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
