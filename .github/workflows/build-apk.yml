name: Build DarkNote APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite ejecutar manualmente desde la UI de GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      - name: Generate Flutter Project Structure
        # Este comando crea las carpetas android/, ios/, etc. si faltan
        # Usamos --platforms=android para ahorrar tiempo y solo crear lo necesario
        # Usamos --no-overwrite para no borrar tu pubspec.yaml o lib/main.dart
        run: flutter create --platforms=android --no-overwrite .

      - name: Get dependencies
        run: flutter pub get

      - name: Create Android local properties
        # Ahora sí existe la carpeta android/, así que esto funcionará
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: darknote-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
