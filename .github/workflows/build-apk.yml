name: Build DarkNote APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      # SOLUCIÓN AL ERROR DE NOMBRE: Forzamos el nombre 'darknote'
      - name: Generate Flutter Project Structure
        run: flutter create --platforms=android --project-name darknote --no-overwrite .

      - name: Get dependencies
        run: flutter pub get

      - name: Create Android local properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # Optimización: Build Release es más rápido de ejecutar y más estable que Debug en CI
      # Usamos --split-per-abi para generar APKs más pequeños (aprox 5-8MB vs 20MB)
      - name: Build Release APK (Split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darknote-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
