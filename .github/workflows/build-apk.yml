name: Build DarkNote APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      - name: Clean and Create Flutter Project Structure
        run: |
          # Eliminar carpeta android para evitar conflictos de generación
          rm -rf android
          # Crear proyecto flutter con nombre válido y plataforma android
          flutter create --platforms=android --project-name darknote .

      - name: Fix AndroidManifest.xml
        run: |
          # Forzar la creación de un AndroidManifest.xml válido si hubo errores
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST_PATH" ] || ! grep -q "<manifest" "$MANIFEST_PATH"; then
            echo "Regenerando AndroidManifest.xml..."
            cat > "$MANIFEST_PATH" <<EOF
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application
        android:label="DarkNote"
        android:name="\${applicationName}"
        android:icon="@mipmap/ic_launcher"
        android:theme="@style/LaunchTheme">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:launchMode="singleTop"
            android:theme="@style/LaunchTheme"
            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
            android:hardwareAccelerated="true"
            android:windowSoftInputMode="adjustResize">
            <meta-data
              android:name="io.flutter.embedding.android.NormalTheme"
              android:resource="@style/NormalTheme"
              />
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
        <meta-data android:name="flutterEmbedding" android:value="2" />
    </application>
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
</manifest>
EOF
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Create Android local properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build Release APK (Split per ABI for lightweight)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: darknote-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
