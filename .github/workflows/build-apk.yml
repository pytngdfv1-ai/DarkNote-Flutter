name: Build Optimized APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      - name: Generate Android Project
        run: flutter create --platforms=android --no-overwrite .

      - name: Get dependencies
        run: flutter pub get

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Split APKs (Release)
        # --split-per-abi crea APKs pequeños específicos para cada arquitectura
        # --release optimiza el código y reduce drásticamente el tamaño
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darknote-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
