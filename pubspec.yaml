name: darknote
description: Un editor de texto ultraligero y funcional con tema oscuro.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Librerías esenciales para funcionalidad real
  file_picker: ^6.1.1      # Para abrir/guardar archivos nativamente
  path_provider: ^2.1.2    # Para acceder a carpetas del dispositivo
  permission_handler: ^11.3.0 # Para pedir permisos de almacenamiento
  shared_preferences: ^2.2.2 # Para guardar configuración

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
