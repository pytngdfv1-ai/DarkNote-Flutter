name: darknote
description: Un editor de texto ultraligero y oscuro para Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Solo lo esencial para manejo de archivos
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  
  # Preferencias ligeras
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
