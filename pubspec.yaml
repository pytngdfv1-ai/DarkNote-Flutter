name: darknote
description: Un editor de texto ultraligero y optimizado con tema oscuro.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Solo dependencias esenciales para funcionalidad básica
  shared_preferences: ^2.2.2 # Para guardar preferencias ligeras (zoom, wrap, etc.)
  path_provider: ^2.1.2    # Necesario para acceso básico a archivos en Android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
